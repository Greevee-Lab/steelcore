<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-labelledby="t d">
  <title id="t">steelcore architecture overview</title>
  <desc id="d">Games and services connect through provider gateways (Insignia, Steelbound, Brainbox, read API) to the steelcore Core API. The core contains identity and accounts, campaign domain, garage shop and trades, pilots, the single campaign clock and trust and audit, all backed by one PostgreSQL database.</desc>
  <style>
    .bg{fill:#f6f7f9}
    .card{fill:#ffffff;stroke:#d3d8e0;stroke-width:1.2}
    .band{fill:#eceff3}
    .core{fill:#e9f4f2;stroke:#0f766e;stroke-width:2}
    .api{fill:#0f766e}
    .mod{fill:#ffffff;stroke:#9cc9c2;stroke-width:1.2}
    .db{fill:#dcefeb;stroke:#0f766e;stroke-width:1.5}
    .h{font:700 26px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1b2230}
    .sub{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5a6474}
    .lbl{font:700 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5a6474;letter-spacing:.08em}
    .t{font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1b2230}
    .s{font:400 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5a6474}
    .apit{font:700 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#ffffff}
    .apis{font:400 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#d5efeb}
    .coret{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f766e}
    .arrow{stroke:#7b8494;stroke-width:1.8;fill:none}
    .ev{stroke:#0f766e;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
    .ah{fill:#7b8494}
    .aht{fill:#0f766e}
    .ins{fill:#2f8f5b}.stb{fill:#d9822b}.brx{fill:#3b6fd8}.svc{fill:#7a5fc0}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0f1218}
      .card{fill:#171b23;stroke:#2d3442}
      .band{fill:#141820}
      .core{fill:#0f2420;stroke:#2bb3a3}
      .api{fill:#167d72}
      .mod{fill:#152a26;stroke:#2b5e57}
      .db{fill:#12302b;stroke:#2bb3a3}
      .h,.t{fill:#e7eaf0}
      .sub,.s,.lbl{fill:#9aa3b2}
      .coret{fill:#4fd1c0}
      .arrow{stroke:#7d8798}
      .ah{fill:#7d8798}
      .ev{stroke:#4fd1c0}
      .aht{fill:#4fd1c0}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="aht"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="830" rx="16"/>
  <text class="h" x="40" y="48">steelcore: one campaign, many clients</text>
  <text class="sub" x="40" y="72">Not crossplay: matches stay on each platform, only campaign state is shared. Each provider runs its own gateway.</text>

  <!-- Band 1: games & services -->
  <rect class="band" x="24" y="92" width="1152" height="122" rx="12"/>
  <text class="lbl" x="40" y="114">GAMES &amp; SERVICES</text>
  <g>
    <rect class="card" x="40" y="124" width="260" height="76" rx="10"/><rect class="ins" x="40" y="124" width="6" height="76" rx="3"/>
    <text class="t" x="60" y="156">Original Xbox</text><text class="s" x="60" y="180">LoC online via Insignia</text>
    <rect class="card" x="326" y="124" width="260" height="76" rx="10"/><rect class="stb" x="326" y="124" width="6" height="76" rx="3"/>
    <text class="t" x="346" y="156">Steelbound</text><text class="s" x="346" y="180">original LoC on PC</text>
    <rect class="card" x="612" y="124" width="260" height="76" rx="10"/><rect class="brx" x="612" y="124" width="6" height="76" rx="3"/>
    <text class="t" x="632" y="156">Project Brainbox</text><text class="s" x="632" y="180">native PC port</text>
    <rect class="card" x="898" y="124" width="262" height="76" rx="10"/><rect class="svc" x="898" y="124" width="6" height="76" rx="3"/>
    <text class="t" x="918" y="156">Community services</text><text class="s" x="918" y="180">stats website · Discord bot</text>
  </g>


  <!-- Band 2: gateways -->
  <rect class="band" x="24" y="226" width="1152" height="132" rx="12"/>
  <text class="lbl" x="40" y="248">PROVIDER GATEWAYS</text>
  <g>
    <rect class="card" x="40" y="258" width="260" height="86" rx="10"/><rect class="ins" x="40" y="258" width="6" height="86" rx="3"/>
    <text class="t" x="60" y="288">Insignia gateway</text><text class="s" x="60" y="310">legacy LoC campaign protocol</text><text class="s" x="60" y="328">identity: XUID</text>
    <rect class="card" x="326" y="258" width="260" height="86" rx="10"/><rect class="stb" x="326" y="258" width="6" height="86" rx="3"/>
    <text class="t" x="346" y="288">Steelbound gateway</text><text class="s" x="346" y="310">legacy LoC campaign protocol</text><text class="s" x="346" y="328">identity: Steelbound account</text>
    <rect class="card" x="612" y="258" width="260" height="86" rx="10"/><rect class="brx" x="612" y="258" width="6" height="86" rx="3"/>
    <text class="t" x="632" y="288">Brainbox gateway</text><text class="s" x="632" y="310">protocol of its choice</text><text class="s" x="632" y="328">identity: Brainbox account</text>
    <rect class="card" x="898" y="258" width="262" height="86" rx="10"/><rect class="svc" x="898" y="258" width="6" height="86" rx="3"/>
    <text class="t" x="918" y="288">Read API</text><text class="s" x="918" y="310">HTTP/JSON, read-only</text><text class="s" x="918" y="328">scope: read:public</text>
  </g>


  <!-- Core -->
  <rect class="core" x="24" y="372" width="1152" height="400" rx="14"/>
  <text class="coret" x="40" y="398">steelcore · Campaign Core</text>
  <text class="s" x="1160" y="398" text-anchor="end">the only component that touches campaign data</text>

  <rect class="api" x="40" y="414" width="1120" height="52" rx="10"/>
  <text class="apit" x="60" y="446">Core API  steelcore.v1</text>
  <text class="apis" x="1140" y="446" text-anchor="end">gRPC · mTLS per gateway · scopes · idempotent writes · every call audited</text>

  <g>
    <rect class="mod" x="40" y="482" width="268" height="92" rx="10"/>
    <text class="t" x="58" y="512">Identity &amp; accounts</text><text class="s" x="58" y="536">players · identities</text><text class="s" x="58" y="556">link codes · admin merges</text>
    <rect class="mod" x="324" y="482" width="268" height="92" rx="10"/>
    <text class="t" x="342" y="512">Campaign domain</text><text class="s" x="342" y="536">war tide · influence · points</text><text class="s" x="342" y="556">leaderboards · awards</text>
    <rect class="mod" x="608" y="482" width="268" height="92" rx="10"/>
    <text class="t" x="626" y="512">Garage, shop &amp; trades</text><text class="s" x="626" y="536">VT serials · stock &amp; drops</text><text class="s" x="626" y="556">trade tokens</text>
    <rect class="mod" x="892" y="482" width="268" height="92" rx="10"/>
    <text class="t" x="910" y="512">Pilots</text><text class="s" x="910" y="536">unique pilot names</text><text class="s" x="910" y="556">opaque pilot blob + version</text>

    <rect class="mod" x="40" y="590" width="552" height="74" rx="10"/>
    <text class="t" x="58" y="620">Campaign clock (exactly one)</text><text class="s" x="58" y="644">turns · rounds · shop drops · awards · faction resets · versioned rules</text>
    <rect class="mod" x="608" y="590" width="552" height="74" rx="10"/>
    <text class="t" x="626" y="620">Trust &amp; audit</text><text class="s" x="626" y="644">per-provider trust · plausibility checks · voiding · bans per player</text>
  </g>

  <!-- database cylinder -->
  <g>
    <path class="db" d="M40 696 a560 14 0 0 0 1120 0 v40 a560 14 0 0 1 -1120 0 z"/>
    <ellipse class="db" cx="600" cy="696" rx="560" ry="14"/>
    <text class="t" x="600" y="738" text-anchor="middle">PostgreSQL · single source of truth</text>
  </g>

  <!-- arrows band1 -> band2 -->
  <path class="arrow" d="M250 200 V256" marker-end="url(#a)"/>
  <path class="arrow" d="M536 200 V256" marker-end="url(#a)"/>
  <path class="arrow" d="M822 200 V256" marker-end="url(#a)"/>
  <path class="arrow" d="M1108 200 V256" marker-end="url(#a)"/>
  <!-- arrows band2 -> core api -->
  <path class="arrow" d="M250 344 V370" marker-end="url(#a)"/>
  <path class="arrow" d="M536 344 V370" marker-end="url(#a)"/>
  <path class="arrow" d="M822 344 V370" marker-end="url(#a)"/>
  <path class="arrow" d="M1108 344 V370" marker-end="url(#a)"/>

  <!-- events -->
  <path class="ev" d="M1176 627 H1188 V301 H1172" marker-end="url(#e)"/>

  <!-- legend -->
  <path class="arrow" d="M40 800 H84" marker-end="url(#a)"/><text class="s" x="94" y="804">API call</text>
  <path class="ev" d="M180 800 H224" marker-end="url(#e)"/><text class="s" x="234" y="804">events (turn started, round ended, awards granted)</text>
  <text class="s" x="1160" y="804" text-anchor="end">Draft · for discussion</text>
</svg>
