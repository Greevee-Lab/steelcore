<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" width="1200" height="890" role="img" aria-labelledby="t d">
<title id="t">steelcore architecture overview</title>
<desc id="d">Games and services connect through provider gateways to the steelcore Core API. Green marks what already runs today: the original Xbox campaign on Insignia, Steelbound with steelnet, the Insignia gateway (today sbcampaign) and, inside the core, the campaign domain, garage, shop and trades, pilots, the campaign clock and the database schema, all implemented in sbcampaign. Project Brainbox is in development. New for steelcore: identity and accounts, the Core API, trust and audit, the Steelbound and Brainbox gateways and the read API.</desc>
